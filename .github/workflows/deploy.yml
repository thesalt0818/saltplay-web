# SaltPlay 웹을 GitHub Pages 에 배포한다.
#
# 하는 일: 코드를 받아 → npm 으로 빌드해서 out/ 폴더를 만들고 → 그 폴더를
# GitHub Pages 에 올린다. 서버가 없으므로 "올린다"가 곧 배포의 전부다.
#
# 언제 도는가: main/master 에 푸시할 때, 또는 Actions 탭에서 손으로 실행할 때.
#
# ⚠️ 게임을 Supabase 나 games.json 에 추가해도 이 작업이 다시 돌기 전에는
#    사이트가 바뀌지 않는다. 정적 배포라 목록이 HTML 에 굳어 있기 때문이다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Actions 탭에서 "Run workflow" 버튼으로 직접 돌릴 수 있게 한다.
  # 게임만 추가하고 코드는 안 건드렸을 때 쓴다.
  workflow_dispatch:

# GitHub Pages 에 올리는 데 필요한 권한. 이 세 줄이 없으면 배포 단계에서 거부당한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
# 진행 중인 것을 취소하지는 않는다 — 배포를 중간에 끊으면 사이트가 반쪽이 될 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # package-lock.json 을 기준으로 의존성을 캐시한다. 빌드가 빨라진다.
          cache: npm

      # npm install 이 아니라 npm ci 다 — package-lock.json 에 적힌 버전 그대로
      # 설치해서, 내 컴퓨터와 서버가 다른 버전으로 빌드되는 일을 막는다.
      - run: npm ci

      - name: 빌드 (out/ 폴더 생성)
        env:
          # NEXT_PUBLIC_ 로 시작하는 값은 빌드할 때 코드에 박히므로 여기서 필요하다.
          # 저장소 Settings → Secrets and variables → Actions 에 넣어 둔다.
          # ⚠️ publishable(anon) 키만 넣는다. service_role 키는 절대 넣지 않는다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # 없으면 lib/site.ts 의 PRODUCTION_URL 이 쓰인다.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # next.config.ts 의 output:"export" 가 만드는 폴더.
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
